[project]
name = "analysis"
version = "0.1.0"
description = "Bayesian analysis with PyMC (nix + uv)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "polars>=1.0",
  "pymc[nutpie]>=6",
  "arviz>=0.20",
  "xarray>=2024.1",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "jupyter-client>=8.6",
]

[tool.uv]
package = false
default-groups = ["dev"]
