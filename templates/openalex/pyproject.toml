[project]
name = "openalex-dataset"
version = "0.1.0"
description = "OpenAlex harvest → Parquet under ~/Datasets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "polars>=1.0",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "duckdb>=1.0",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "jupyter-client>=8.6",
]

[tool.uv]
package = false
default-groups = ["dev"]
