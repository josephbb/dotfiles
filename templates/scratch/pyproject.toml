[project]
name = "scratch"
version = "0.1.0"
description = "Light reproducible Python scratch (nix + uv)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "jupyter-client>=8.6",
]

[tool.uv]
package = false
default-groups = ["dev"]
